<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Page Not Found | ASE Technologies</title>
    <meta name="description" content="The requested ASE Technologies page could not be found. Return to our homepage or explore our services." />
    <meta name="robots" content="noindex, follow" />
    <link rel="canonical" href="https://asetechnologies.in/" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            font-family: 'Segoe UI', Tahoma, sans-serif;
        }

        .error-container {
            text-align: center;
            padding: 2rem;
        }

        .error-code {
            font-size: 10rem;
            font-weight: bold;
            margin-bottom: 1rem;
            background: linear-gradient(to right, #ff6b6b, #ee5a24);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .error-message {
            font-size: 2rem;
            margin-bottom: 2rem;
            opacity: 0.9;
        }

        .description {
            max-width: 500px;
            margin: 0 auto;
            opacity: 0.7;
            line-height: 1.6;
        }

        .back-link {
            margin-top: 3rem;
            padding: 1rem 2rem;
            background: white;
            color: #667eea;
            text-decoration: none;
            border-radius: 5px;
            font-weight: 500;
            transition: all 0.3s ease;
        }

        .back-link:hover {
            background: #667eea;
            color: white;
        }

        @media (max-width: 600px) {
            .error-code {
                font-size: 6rem;
            }
            .error-message {
                font-size: 1.5rem;
            }
        }
    </style>
</head>
<body>
    <div class="error-container">
        <div class="error-code">404</div>
        <div class="error-message">Page Not Found</div>
        <div class="description">
            The page you're looking for doesn't exist or has been removed.
        </div>
        <a href="/" class="back-link">Go Homepage</a>
    </div>
</body>
</html>
